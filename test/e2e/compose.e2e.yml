# E2E-only overlay: exposes intent-solver's admin console for the failure dump.
# Applied only by the e2e harness (regtest.mjs's compose invocations don't read it).
services:
  intent-solver:
    environment:
      # Admin console for the failure dump — loopback-only on the runner; no auth.
      ADMIN_PORT: "8788"
      ADMIN_HOST: 0.0.0.0
    ports:
      - "8788:8788"
