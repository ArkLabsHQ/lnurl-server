name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit and integration tests
        run: pnpm test

      - name: Type check
        run: pnpm type-check

      - name: Build distribution
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build production container
        run: docker build --tag lnurl-server:ci .

      - name: Smoke-test production container
        run: node scripts/container-smoke.mjs lnurl-server:ci

  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: authority
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: authority/go.mod
          cache-dependency-path: authority/go.sum

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Start DynamoDB Local
        run: |
          docker run -d --name dynamodb -p 8000:8000 amazon/dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
          for _ in $(seq 1 30); do curl -s -o /dev/null http://localhost:8000 && exit 0; sleep 1; done
          docker logs dynamodb; exit 1

      - name: Test
        run: go test ./...
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000

  attestor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: attestor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: attestor/go.mod
          cache-dependency-path: attestor/go.sum

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build the static binary the image carries
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/lnurl-attest" ./cmd/lnurl-attest

  authority-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: authority/go.mod
          cache-dependency-path: authority/go.sum

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: TypeScript enclave against the Go authority
        run: pnpm test:authority
