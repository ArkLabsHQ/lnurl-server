name: Publish demo wallet

# The demo wallet is a static bundle pinned to the mutinynet instance, so every
# merge to main republishes it. It builds the client package first: the wallet
# imports `@arkade-os/lnurl-client` by its package entry, which points at dist/,
# and nothing else in CI builds it before this runs.
on:
  push:
    branches: [main]
    paths:
      - "packages/demo-wallet/**"
      - "packages/client/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one midway: a cancelled deploy can
# leave the site on a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the client package
        run: pnpm build:client

      - name: Build the demo wallet
        # A project site is served from /<repo>/, so the bundle needs that prefix
        # or every asset 404s at the root.
        env:
          DEMO_WALLET_BASE: /${{ github.event.repository.name }}/
        run: pnpm --filter @arkade-os/lnurl-demo-wallet build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/demo-wallet/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
