name: browser e2e

# Drives the built wallet in a real Chromium. It exists because the unit suite,
# the type-check and the production build were all green while the wallet could
# not create an identity at all -- the SDK refuses a mainnet derivation against a
# mutinynet operator, and nothing below a real browser could see it.
#
# Two jobs, because they answer different questions. `regtest` raises the repo's
# own Arkade stack and drives every rail against it, funded from a faucet, so it
# can assert real settlement without anybody's sats. `mutinynet` is the smaller
# check that the wallet still works against the live deployment; it registers on
# a shared instance and revokes in afterEach, so a failed run can leave an
# address behind -- the accepted cost of testing the real thing.
#
# The funded mutinynet specs are not run here. They read a wallet provisioned by
# `provision.spec.ts` and topped up by hand with real sats, which a runner cannot
# have; the paths they covered are covered against regtest instead, where a
# faucet makes the same assertions for free.
on:
  pull_request:
    branches: [main]
    paths:
      - "packages/demo-wallet/**"
      - "packages/client/**"
      - ".github/workflows/browser-e2e.yml"
  push:
    branches: [main]
    paths:
      - "packages/demo-wallet/**"
      - "packages/client/**"
      - ".github/workflows/browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The harness raises arkade-regtest from ./regtest, so the submodule is
      # load-bearing here in a way it is not for the mutinynet job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the client package
        run: pnpm build:client

      - name: Install Chromium
        run: pnpm --filter @arkade-os/lnurl-demo-wallet exec playwright install --with-deps chromium

      - name: Run the browser suite against a local stack
        run: pnpm test:browser:local

      - name: Dump regtest stack logs on failure
        if: failure()
        run: |
          docker ps || true
          for c in arkd intent-solver covclaimd emulator lnd lnd-peer; do
            echo "=== $c ==="; docker logs "$c" --tail 200 2>&1 || true
          done
          echo "=== lnurl-server ==="; tail -n 300 .e2e-cache/browser-local/*.log 2>/dev/null || true

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-regtest
          path: |
            packages/demo-wallet/playwright-report
            packages/demo-wallet/test-results
          retention-days: 7

  mutinynet:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The wallet imports the client by its package entry, which points at dist/.
      - name: Build the client package
        run: pnpm build:client

      - name: Install Chromium
        run: pnpm --filter @arkade-os/lnurl-demo-wallet exec playwright install --with-deps chromium

      # Skips the specs needing a hand-funded wallet, and the provisioner that
      # mints one. Locally `pnpm test:browser` still runs everything.
      - name: Run the browser suite
        run: pnpm --filter @arkade-os/lnurl-demo-wallet exec playwright test --grep-invert "@funded|@provision"

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            packages/demo-wallet/playwright-report
            packages/demo-wallet/test-results
          retention-days: 7
