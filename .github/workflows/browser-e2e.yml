name: browser e2e

# Drives the built wallet in a real Chromium against the live mutinynet
# endpoints. It exists because the unit suite, the type-check and the production
# build were all green while the wallet could not create an identity at all --
# the SDK refuses a mainnet derivation against a mutinynet operator, and nothing
# below a real browser could see it.
#
# It registers on a shared instance and revokes in afterEach, so a failed run can
# still leave an address behind; that is the accepted cost of testing the real
# thing rather than a mock.
on:
  pull_request:
    branches: [main]
    paths:
      - "packages/demo-wallet/**"
      - "packages/client/**"
      - ".github/workflows/browser-e2e.yml"
  push:
    branches: [main]
    paths:
      - "packages/demo-wallet/**"
      - "packages/client/**"
      - ".github/workflows/browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The wallet imports the client by its package entry, which points at dist/.
      - name: Build the client package
        run: pnpm build:client

      - name: Install Chromium
        run: pnpm --filter @arkade-os/lnurl-demo-wallet exec playwright install --with-deps chromium

      - name: Run the browser suite
        run: pnpm test:browser

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            packages/demo-wallet/playwright-report
            packages/demo-wallet/test-results
          retention-days: 7
