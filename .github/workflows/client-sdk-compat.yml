name: Client SDK compatibility

on:
  pull_request:
    paths:
      - "packages/client/**"
      - "scripts/check-client-sdk-compat.mjs"
      - ".github/workflows/client-sdk-compat.yml"
      - "package.json"
      - "tsconfig.json"
  push:
    branches: [main]
    paths:
      - "packages/client/**"
      - "scripts/check-client-sdk-compat.mjs"
      - ".github/workflows/client-sdk-compat.yml"
      - "package.json"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  client-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: ["0.5.0-rc.0", "0.5.0-rc.19"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13"
      - run: node scripts/check-client-sdk-compat.mjs ${{ matrix.sdk }}
